name: Apply email verification UI

on:
  push:
    branches:
      - chatgpt/email-verification-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/email-verification-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply UI patch
        run: python3 scripts/apply-email-verification-ui.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/skillhub-inline.js').write_text(scripts[-1])
          PY
          node --check /tmp/skillhub-inline.js
      - name: Commit implementation and cleanup
        run: |
          git config user.name "SkillHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply-email-verification-ui.py .github/workflows/apply-email-verification-ui.yml
          git add index.html
          git commit -m "Add email verification flow to UI"
          git push origin HEAD:chatgpt/email-verification-ui
