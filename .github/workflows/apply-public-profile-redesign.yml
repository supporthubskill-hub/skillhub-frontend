name: Apply public profile redesign
on:
  push:
    branches:
      - chatgpt/public-profile-redesign
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply redesign
        run: python scripts/public_profile_redesign.py
      - name: Validate JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(); Path('/tmp/skillhub.js').write_text('\\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))"
          node --check /tmp/skillhub.js
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-public-profile-redesign.yml scripts/public_profile_redesign.py
          git add index.html
          git commit -m "Redesign public provider profiles"
          git push