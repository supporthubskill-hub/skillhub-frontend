name: Apply public profile redesign
on:
  push:
    branches: [chatgpt/public-profile-redesign]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Redesign public provider profile
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(); marker='        /* Review Stars */'
          css='''        /* Public provider profile */
        #providerProfileDialog { width:min(94vw,620px); }
        .public-profile-hero { text-align:center; padding:8px 4px 18px; border-bottom:1px solid var(--border); }
        .public-profile-avatar { width:92px; height:92px; border-radius:50%; object-fit:cover; border:4px solid var(--card-bg); box-shadow:0 8px 24px rgba(15,23,42,.14); background:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-size:2.7rem; }
        .public-profile-hero h2 { margin-top:10px; font-size:1.55rem; }
        .public-profile-headline { margin-top:4px; color:#64748b; font-weight:650; }
        .public-profile-badges { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-top:12px; }
        .profile-badge { padding:6px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--border); font-size:.78rem; font-weight:650; }
        .profile-rating { color:#b45309; }
        .public-profile-section { padding-top:18px; }
        .public-profile-section h3 { margin-bottom:9px; }
        .profile-copy { line-height:1.55; white-space:pre-wrap; }
        .profile-chip-list { display:flex; flex-wrap:wrap; gap:7px; }
        .profile-chip { padding:6px 9px; border-radius:8px; background:var(--bg); border:1px solid var(--border); font-size:.82rem; }
        .profile-service-card { border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:8px; }
        .profile-service-row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
        .profile-service-price { color:var(--success); font-weight:800; white-space:nowrap; }
        .profile-review { border-top:1px solid var(--border); padding:12px 0; }
        .profile-review:first-of-type { border-top:0; }
        .profile-portfolio { display:inline-block; margin-top:12px; text-decoration:none; }
        @media (max-width:700px) { .public-profile-avatar{width:82px;height:82px}.profile-service-row{flex-direction:column}.profile-service-price{white-space:normal} }

'''
          s=s.replace(marker,css+marker)
          pattern=r"        async function openProviderProfile\(id\) \{.*?\n        \}\n        async function loadReviewOptions"
          replacement='''        async function openProviderProfile(id) {
            const dialog=document.getElementById('providerProfileDialog'),content=document.getElementById('providerProfileContent');
            content.innerHTML='<div class="chat-empty">Cargando perfil…</div>'; dialog.showModal();
            try {
                const response=await fetch(`${API_URL}/api/providers/${id}`),data=await response.json();
                if(!response.ok) throw new Error(data.error||'No se pudo cargar el perfil');
                const p=data.profile||{},services=Array.isArray(data.services)?data.services:[],reviews=Array.isArray(data.reviews)?data.reviews:[];
                const avatar=p.avatarUrl?`<img class="public-profile-avatar" src="${escapeHtml(p.avatarUrl)}" alt="Foto de perfil">`:'<div class="public-profile-avatar">👤</div>';
                const chips=(v)=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="profile-chip">${escapeHtml(x)}</span>`).join('');
                const serviceCards=services.length?services.map(x=>`<div class="profile-service-card"><div class="profile-service-row"><div><strong>${escapeHtml(x.name)}</strong><p class="service-meta">${escapeHtml(x.area||'Remoto')}</p><p style="margin-top:6px;font-size:.88rem">${escapeHtml(x.desc||'')}</p></div><span class="profile-service-price">$${Number(x.price||0).toFixed(2)}</span></div><button class="btn btn-secondary" style="margin-top:10px" onclick="providerProfileDialog.close();openServiceDialog(${Number(x.id)})">Ver servicio</button></div>`).join(''):'<p class="service-meta">No tiene servicios públicos en este momento.</p>';
                const reviewCards=reviews.length?reviews.map(r=>`<div class="profile-review"><strong>⭐ ${Number(r.rating||0).toFixed(1)} · ${escapeHtml(r.reviewerName)}</strong><p class="service-meta">${escapeHtml(r.serviceName||'Servicio')}</p><p style="margin-top:6px">${escapeHtml(r.comment||'')}</p></div>`).join(''):'<p class="service-meta">Aún no tiene reseñas.</p>';
                content.innerHTML=`<div class="public-profile-hero">${avatar}<h2>${escapeHtml(p.name||'Proveedor de SkillHub')}</h2><p class="public-profile-headline">${escapeHtml(p.headline||'Profesional de SkillHub')}</p><div class="public-profile-badges"><span class="profile-badge profile-rating">⭐ ${Number(p.rating||0).toFixed(1)} · ${Number(p.reviewCount||0)} reseñas</span>${p.location?`<span class="profile-badge">📍 ${escapeHtml(p.location)}</span>`:''}${p.remoteAvailable?'<span class="profile-badge">💻 Disponible remoto</span>':''}</div></div><section class="public-profile-section"><h3>Sobre mí</h3><p class="profile-copy">${escapeHtml(p.bio||'Este usuario todavía no ha añadido una biografía.')}</p>${p.portfolioUrl?`<a class="btn btn-secondary profile-portfolio" href="${escapeHtml(p.portfolioUrl)}" target="_blank" rel="noopener noreferrer">🔗 Ver portafolio</a>`:''}</section>${p.skills?`<section class="public-profile-section"><h3>Habilidades</h3><div class="profile-chip-list">${chips(p.skills)}</div></section>`:''}${p.experience?`<section class="public-profile-section"><h3>Experiencia</h3><p class="profile-copy">${escapeHtml(p.experience)}</p></section>`:''}${p.languages?`<section class="public-profile-section"><h3>Idiomas</h3><div class="profile-chip-list">${chips(p.languages)}</div></section>`:''}<section class="public-profile-section"><h3>🛠️ Servicios</h3>${serviceCards}</section><section class="public-profile-section"><h3>⭐ Reseñas</h3>${reviewCards}</section>`;
            } catch(error) { content.innerHTML=`<div class="chat-empty">${escapeHtml(error.message)}</div>`; }
        }
        async function loadReviewOptions'''
          s,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'Expected one profile function, found {n}')
          p.write_text(s)
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/skillhub.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/skillhub.js
      - name: Commit final change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-public-profile-redesign.yml
          git add index.html
          git commit -m "Redesign public provider profiles"
          git push