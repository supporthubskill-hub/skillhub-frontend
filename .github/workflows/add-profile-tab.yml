name: Profile tab update
on:
  push:
    branches:
      - chatgpt/services-navigation-upgrade
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/services-navigation-upgrade
      - run: python scripts/add_profile_tab.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - run: |
          rm -f .github/workflows/add-profile-tab.yml scripts/add_profile_tab.py
          git config user.name "SkillHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add dedicated profile tab"
          git push origin HEAD:chatgpt/services-navigation-upgrade
