name: Services navigation upgrade

on:
  push:
    branches:
      - chatgpt/services-navigation-upgrade

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/services-navigation-upgrade
      - name: Patch frontend
        run: python .github/scripts/services_navigation_upgrade.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>', text)
          main=next((b for b in blocks if 'const API_URL' in b), '')
          if not main: raise SystemExit('main script not found')
          Path('/tmp/index.js').write_text(main)
          PY
          node --check /tmp/index.js
      - name: Commit grouped frontend update
        run: |
          rm .github/workflows/services-navigation-upgrade.yml .github/scripts/services_navigation_upgrade.py
          git config user.name "SkillHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unify services reservations and help navigation"
          git push origin HEAD:chatgpt/services-navigation-upgrade
