name: Cleanup demo data

on:
  push:
    branches:
      - chatgpt/remove-demo-data

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-demo-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update frontend
        run: python scripts/cleanup_demo.py
      - name: Commit cleanup
        run: |
          git config user.name "SkillHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove remaining demo dashboard data"
          git push origin HEAD:chatgpt/remove-demo-data
