<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeqviro Admin</title>
  <style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot strong{color:#4f46e5;font-size:1.25rem}.boot p{color:#64748b}</style>
</head>
<body>
  <div class="boot" id="boot"><div><strong>Zeqviro Admin</strong><p>Preparando el panel administrativo…</p></div></div>
  <script>
    (async () => {
      try {
        const response = await fetch('/admin.html?admin_source=1', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar Admin');
        let html = await response.text();
        html = html.replace('</head>', '<link rel="stylesheet" href="/admin-notifications.css?v=1"><link rel="stylesheet" href="/admin-user-warnings.css?v=1"><link rel="stylesheet" href="/reports-trust.css?v=1"></head>');
        html = html.replace('</body>', '<script src="/admin-notifications.js?v=1"><\/script><script src="/admin-user-warnings.js?v=1"><\/script><script src="/admin-sanctions.js?v=1"><\/script><script src="/reports-trust.js?v=1"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('boot').innerHTML = '<div><strong>Zeqviro Admin</strong><p>No se pudo cargar el panel. Intenta actualizar la página.</p></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
