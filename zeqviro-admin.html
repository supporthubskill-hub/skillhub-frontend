<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeqviro Admin</title>
  <meta name="theme-color" content="#4f46e5">
  <style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot strong{font-size:1.35rem}.boot p{color:#64748b}</style>
</head>
<body>
  <div class="boot" id="boot"><div><strong>Zeqviro Admin</strong><p>Cargando…</p></div></div>
  <script>
    (async () => {
      try {
        const response = await fetch('/admin.html?zeqviro_source=1', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar el panel');
        let html = await response.text();
        html = html.replaceAll('SkillHub', 'Zeqviro');
        html = html.replaceAll('Zeqviro 🚀', 'Zeqviro');

        const commissionSection = `
          <section class="card" id="platformSettingsCard">
            <h3>Comisión de Zeqviro</h3>
            <p class="muted">Configura el porcentaje de plataforma para nuevas reservas. Los pagos reales siguen desactivados durante la beta.</p>
            <div class="row" style="margin-top:12px;align-items:end">
              <div class="grow"><label for="commissionPercent" style="display:block;font-weight:700;margin-bottom:6px">Porcentaje de comisión</label><input id="commissionPercent" type="number" min="0" max="30" step="0.25" inputmode="decimal" style="width:100%"></div>
              <button id="saveCommissionButton" class="btn" type="button">Guardar comisión</button>
            </div>
            <div id="commissionPreview" class="muted" style="margin-top:10px"></div>
            <div id="commissionStatus" style="min-height:22px;margin-top:8px"></div>
            <div class="health" style="margin-top:14px">
              <div class="health-box"><strong>Marca</strong><span id="platformBrand">Zeqviro</span></div>
              <div class="health-box"><strong>Soporte</strong><span id="platformSupport">—</span></div>
              <div class="health-box"><strong>Estado</strong><span id="platformBeta" class="pill warn">Beta</span></div>
            </div>
          </section>`;
        html = html.replace('</main>', commissionSection + '</main>');

        const platformScript = `<script>
          let currentCommissionPercent = 10;
          const commissionInput=()=>document.getElementById('commissionPercent');
          const commissionStatus=()=>document.getElementById('commissionStatus');
          function updateCommissionPreview(){
            const input=commissionInput();
            const value=Number(input?.value||0);
            const preview=document.getElementById('commissionPreview');
            if(!preview)return;
            if(!Number.isFinite(value)){preview.textContent='Escribe un porcentaje válido.';return;}
            const example=100,fee=example*(value/100),provider=example-fee;
            preview.textContent='Ejemplo con $100: Zeqviro $'+fee.toFixed(2)+' · Proveedor $'+provider.toFixed(2)+' (antes de cargos externos).';
          }
          async function platformRequest(path,method='GET',body){
            if(!session?.token) throw new Error('Sesión de administrador no disponible. Vuelve a iniciar sesión.');
            const r=await fetch(API_URL+path,{
              method,
              headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.token},
              body:body?JSON.stringify(body):undefined
            });
            const j=await r.json().catch(()=>({}));
            if(r.status===401){sessionStorage.removeItem('skillhubSession');throw new Error('La sesión expiró. Vuelve a iniciar sesión.');}
            if(!r.ok) throw new Error(j.error||('Error '+r.status+' al guardar la comisión'));
            return j;
          }
          async function loadPlatformSettings(){
            const status=commissionStatus();
            try{
              const s=await platformRequest('/api/admin/settings');
              currentCommissionPercent=Number(s.commissionPercent ?? 10);
              const input=commissionInput();
              const brand=document.getElementById('platformBrand');
              const support=document.getElementById('platformSupport');
              const beta=document.getElementById('platformBeta');
              if(input) input.value=currentCommissionPercent;
              if(brand) brand.textContent=s.brandName||'Zeqviro';
              if(support) support.textContent=s.supportEmail||'—';
              if(beta){beta.textContent=s.betaMode?'Beta activa':'Beta desactivada';beta.className=s.betaMode?'pill warn':'pill ok';}
              if(status){status.textContent='Comisión cargada correctamente.';status.style.color='var(--success)';}
              updateCommissionPreview();
            }catch(e){if(status){status.textContent=e.message||'No se pudo cargar la configuración.';status.style.color='var(--danger)';}}
          }
          async function saveCommission(){
            const button=document.getElementById('saveCommissionButton');
            const status=commissionStatus();
            const input=commissionInput();
            const percent=Number(input?.value);
            if(!Number.isFinite(percent)||percent<0||percent>30){if(status){status.textContent='La comisión debe estar entre 0% y 30%.';status.style.color='var(--danger)';}return;}
            if(!window.confirm('Cambiar comisión de '+currentCommissionPercent+'% a '+percent+'%?')) return;
            if(button)button.disabled=true;
            if(status){status.textContent='Guardando '+percent+'%…';status.style.color='var(--muted)';}
            try{
              const result=await platformRequest('/api/admin/settings/commission','PATCH',{percent});
              currentCommissionPercent=Number(result.commissionPercent ?? percent);
              if(input)input.value=currentCommissionPercent;
              if(status){status.textContent=(result.message||'Comisión actualizada.')+' Valor guardado: '+currentCommissionPercent+'%';status.style.color='var(--success)';}
              updateCommissionPreview();
              setTimeout(loadPlatformSettings,400);
              if(typeof loadActivity==='function')loadActivity().catch(()=>{});
            }catch(e){if(status){status.textContent='No se guardó: '+(e.message||'error desconocido');status.style.color='var(--danger)';}}
            finally{if(button)button.disabled=false;}
          }
          document.getElementById('commissionPercent')?.addEventListener('input',updateCommissionPreview);
          document.getElementById('saveCommissionButton')?.addEventListener('click',saveCommission);
          document.querySelector('button[onclick="refreshAll()"]')?.addEventListener('click',loadPlatformSettings);
          loadPlatformSettings();
        <\/script>`;
        html = html.replace('</body>', platformScript + '</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('boot').innerHTML = '<div><strong>Zeqviro Admin</strong><p>No se pudo cargar el panel. Intenta actualizar la página.</p></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
