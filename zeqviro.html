<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeqviro | Servicios cerca de ti y en línea</title>
  <meta name="description" content="Encuentra, compara y solicita servicios en Zeqviro. Habla con el proveedor antes de que confirme tu reserva.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://zeqviro.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zeqviro">
  <meta property="og:title" content="Zeqviro | Marketplace de servicios">
  <meta property="og:description" content="Encuentra servicios, conversa con proveedores y organiza solicitudes de reserva.">
  <meta property="og:url" content="https://zeqviro.com/">
  <style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot strong{font-size:1.35rem;color:#4f46e5}.boot p{color:#64748b}</style>
</head>
<body>
  <div class="boot" id="boot"><div><strong>Zeqviro</strong><p>Preparando servicios y conversaciones…</p></div></div>
  <script>
    (async () => {
      try {
        const response = await fetch('/zeqviro-base.html?booking_flow=1', { cache: 'no-store' });
        if (!response.ok) throw new Error('No se pudo cargar Zeqviro');
        let source = await response.text();
        const hook = "        document.open();";
        const injection = `        html = html.replace('</head>', '<link rel="stylesheet" href="/booking-flow.css?v=1"><link rel="stylesheet" href="/ui-polish.css?v=1"><link rel="stylesheet" href="/notification-center.css?v=1"></head>');\n        html = html.replace('</body>', '<script src="/booking-flow.js?v=1"><\\/script><script src="/rejection-controls.js?v=1"><\\/script><script src="/ui-polish.js?v=1"><\\/script><script src="/notification-center.js?v=1"><\\/script></body>');\n        document.open();`;
        if (!source.includes(hook)) throw new Error('No se encontró el punto de integración');
        source = source.replace(hook, injection);
        document.open();
        document.write(source);
        document.close();
      } catch (error) {
        document.getElementById('boot').innerHTML = '<div><strong>Zeqviro</strong><p>No se pudo cargar la aplicación. Intenta actualizar la página.</p></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
